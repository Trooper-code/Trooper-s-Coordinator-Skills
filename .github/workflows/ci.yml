# Validates the skills, templates and scripts on every push and pull request.
# Pushing a tag like v1.4.0 also builds one upload-ready .zip per skill (with the templates bundled inside, so
# Claude can copy them into your project without fetching anything) and creates a GitHub Release whose notes are
# that version's section of CHANGELOG.md.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and links
        run: python scripts/validate.py
      - name: Test the handoff checker
        run: python tests/test_check_handoff.py
      - name: Test the other scripts
        run: python tests/test_scripts.py
      - name: This repo is safe to publish
        run: python templates/scripts/check-safe-to-publish.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from CHANGELOG.md
        run: python templates/scripts/release-notes.py "${GITHUB_REF_NAME}" > notes.md
      - name: Build one zip per skill (templates bundled), plus one with everything
        run: |
          mkdir -p dist
          for d in skills/*/; do
            cp -r templates "${d}templates"
          done
          cd skills
          for d in */; do
            name="${d%/}"
            zip -qr "../dist/${name}.zip" "$name"
          done
          cd ..
          rm -rf skills/*/templates
          zip -qr dist/all-skills-and-templates.zip skills templates LICENSE README.md CHANGELOG.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
